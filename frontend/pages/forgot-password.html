<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CampusConnect</title>
  <meta name="description" content="Reset your CampusConnect digital notice board password.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/glass.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8);
    }
  </style>
</head>
<body class="glass-body">
  <div class="login-container">
    <div class="glass-panel login-card">
      
      <!-- Brand Header -->
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <div class="brand-logo" style="margin: 0 auto var(--space-3); width: 44px; height: 44px; font-size: 1.3rem;">CC</div>
        <h2 style="margin: 0; font-size: var(--font-size-2xl); color: var(--color-primary); font-weight: 700;">Reset Password</h2>
        <p style="margin: 0.35rem 0 0; color: var(--color-text-muted); font-size: var(--font-size-sm);">Enter your registered university email</p>
      </div>

      <!-- Alert / Status message -->
      <div id="resetAlert" style="display: none; padding: var(--space-3); border-radius: var(--radius-md); font-size: var(--font-size-sm); margin-bottom: var(--space-4);"></div>

      <!-- Reset Form -->
      <form id="resetForm">
        
        <div style="margin-bottom: var(--space-4);">
          <label for="email" style="display: block; font-size: var(--font-size-sm); font-weight: 600; margin-bottom: 0.35rem; color: var(--color-text-main);">
            Campus Email Address
          </label>
          <input type="email" id="email" class="glass-input" placeholder="student@campusconnect.edu" required autocomplete="email">
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; padding: 0.75rem; margin-top: var(--space-2); font-size: var(--font-size-base);">
          Send Reset Instructions
        </button>

      </form>

      <!-- Return link -->
      <div style="text-align: center; margin-top: var(--space-6); border-top: 1px solid var(--color-divider); padding-top: var(--space-4); display: flex; justify-content: space-between;">
        <a href="/login" style="font-size: var(--font-size-sm); color: var(--color-accent); text-decoration: none; font-weight: 600;">
          &larr; Back to Login
        </a>
        <a href="/" style="font-size: var(--font-size-sm); color: var(--color-text-muted); text-decoration: none; font-weight: 500;">
          Public Portal &rarr;
        </a>
      </div>

    </div>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('resetAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying identity...';

      setTimeout(() => {
        alertBox.style.display = 'block';
        alertBox.style.background = 'var(--color-success-bg)';
        alertBox.style.color = 'var(--color-success)';
        alertBox.innerHTML = `
          <strong>Password Reset Dispatched!</strong><br>
          A secure verification link has been sent to <strong>${escapeHtml(email)}</strong>. For development mode, default password is: <code>student123</code> / <code>staff123</code> / <code>admin123</code>.
        `;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Resend Reset Link';
      }, 700);
    });

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
